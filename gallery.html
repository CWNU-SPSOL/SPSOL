<script src="js/main.js"></script>
<script>
// ── 갤러리 필터 ───────────────────────────────────────
const filterBtns  = document.querySelectorAll('.gallery-filter__btn');
const galleryItems = document.querySelectorAll('.gallery-item');

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    galleryItems.forEach(item => {
      const show = filter === 'all' || item.dataset.category === filter;
      item.style.display = show ? 'block' : 'none';
    });
  });
});

// ── 라이트박스 ────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');
const lbTitle  = document.getElementById('lbTitle');
const lbDesc   = document.getElementById('lbDesc');
const lbLoc    = document.getElementById('lbLocation').querySelector('span');

let currentIndex = 0;
let visibleItems = [];

function openLightbox(index) {
  visibleItems = [...galleryItems].filter(i => i.style.display !== 'none');
  currentIndex = index;
  updateLightbox();
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  const item = visibleItems[currentIndex];
  const img  = item.querySelector('img');
  lbImg.src       = img.src;
  lbImg.alt       = img.alt;
  lbTitle.textContent = item.dataset.title    || '';
  lbDesc.textContent  = item.dataset.desc     || '';
  lbLoc.textContent   = item.dataset.location || '';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
}

// 각 아이템 클릭 이벤트
galleryItems.forEach((item, i) => {
  item.addEventListener('click', () => {
    visibleItems = [...galleryItems].filter(el => el.style.display !== 'none');
    const visIdx = visibleItems.indexOf(item);
    openLightbox(visIdx);
  });
});

document.getElementById('lbClose').addEventListener('click', closeLightbox);

document.getElementById('lbPrev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + visibleItems.length) % visibleItems.length;
  updateLightbox();
});

document.getElementById('lbNext').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % visibleItems.length;
  updateLightbox();
});

// 배경 클릭 시 닫기
lightbox.addEventListener('click', e => {
  if (e.target === lightbox) closeLightbox();
});

// 키보드 조작
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + visibleItems.length) % visibleItems.length; updateLightbox(); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % visibleItems.length; updateLightbox(); }
});
</script>
